name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # .npmrc sets ignore-scripts=true; this fails when a dependency with an install script is not on the
      # package.json "allowedInstallScripts" list (it reads only .npmrc, package.json and package-lock.json)
      - name: Install-script policy
        run: npm run check:install-scripts

      - name: Install dependencies
        run: npm ci

      # Runs the install scripts of exactly the allowed packages (better-sqlite3, esbuild; fsevents on macOS)
      - name: Build allowed native dependencies
        run: npm run rebuild:native

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  brain-trainer-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: brain-trainer/requirements-dev.txt

      - name: Install dependencies pinned by hash
        run: "pip install --require-hashes --no-deps --only-binary=:all: -r brain-trainer/requirements-dev.txt"

      - name: Test the trainer
        run: python -m pytest brain-trainer -q

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits and comments on findings
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
