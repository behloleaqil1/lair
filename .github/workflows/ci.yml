name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  brain-trainer-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: brain-trainer/requirements-dev.txt

      - name: Install dependencies pinned by hash
        run: "pip install --require-hashes --no-deps --only-binary=:all: -r brain-trainer/requirements-dev.txt"

      - name: Test the trainer
        run: python -m pytest brain-trainer -q

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits and comments on findings
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  revert-checks:
    # Proves that a PR's tests guard the code they claim to guard (CONTRIBUTING.md, "Revert checks").
    # Runs only on pull requests, after the build job passes.
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Bounded: at most 10 checks (--max-checks), each test run killed after 120 s (--timeout)
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the base commit; the token is not left in .git/config for the PR's code
          fetch-depth: 0
          persist-credentials: false

      - name: Read the exemption label history
        # Before any PR code runs; the token is used only in this step. Read live (not from the event), so
        # re-running the job after the owner labels the PR sees the label. A failed read exempts nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! timeout 60 gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events" \
            --jq '.[] | select(.event == "labeled" or .event == "unlabeled") | {event, label: (.label.name // ""), actor: (.actor.login // "")} | tojson' \
            > "$RUNNER_TEMP/label-events.ndjson"; then
            echo "::warning::Could not read the label history; no exemption applies"
            : > "$RUNNER_TEMP/label-events.ndjson"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Revert checks
        # The script decides whether lines are required (title, changed paths, owner label) from its own
        # parse of the body, so fenced examples never count; a docs-only PR needs none
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER: ${{ github.repository_owner }}
          # Repository variables (owner-set): REVERT_CHECKS_REQUIRE=auto|always|never, REVERT_CHECKS_CODE_PATHS=src/,scripts/
          REQUIRE_MODE: ${{ vars.REVERT_CHECKS_REQUIRE }}
          CODE_PATHS: ${{ vars.REVERT_CHECKS_CODE_PATHS }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          # The base commit's copy grades the PR when it has one, so a PR is not graded by its own copy
          # (a PR that changes the script must keep these options working)
          script=src/cli/revert-checks.ts
          if git cat-file -e "$BASE_SHA:$script" 2>/dev/null; then
            git show "$BASE_SHA:$script" > "$RUNNER_TEMP/revert-checks.mts"
            script="$RUNNER_TEMP/revert-checks.mts"
          fi
          npx --no-install tsx "$script" "--title=$PR_TITLE" --exempt-label=revert-check-exempt \
            "--exempt-actors=$OWNER" "--label-events=$RUNNER_TEMP/label-events.ndjson" \
            "--require=${REQUIRE_MODE:-auto}" "--code-paths=${CODE_PATHS:-src/,scripts/}" \
            --max-checks=10 --timeout=120 "$RUNNER_TEMP/pr-body.md" "$BASE_SHA"
